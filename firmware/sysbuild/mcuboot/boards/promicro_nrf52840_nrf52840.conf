# Disable nRF5 bootloader assumption - MCUboot starts at 0x0
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n

# Disable QSPI (not present on promicro)
CONFIG_NORDIC_QSPI_NOR=n

# =============================================================================
# USB serial recovery (mcumgr/SMP over USB CDC ACM)
#
# On every boot MCUboot enumerates as a USB serial port and waits
# BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT ms for an mcumgr command. Any command
# received in that window keeps it in recovery mode for image upload;
# otherwise the application boots. It also stays in recovery when no valid
# application is present. The application reboots into this window when
# USB power is plugged in after being absent, so no button is needed.
# =============================================================================
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=3000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_MGMT_ECHO=y

CONFIG_MULTITHREADING=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_DEVICE_PRODUCT="LEDCopper MCUboot"

# USB stack + serial recovery do not fit in the default 48 KB
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000

# Nothing else may write to the CDC ACM port used by mcumgr
CONFIG_LOG=n
